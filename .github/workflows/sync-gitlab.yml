name: Sincronizar con GitLab

on:
  push:
    branches: ['**']
    tags: ['**']

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enviar cambios a GitLab
        run: git push "https://oauth2:${{ secrets.GITLAB_TOKEN }}@gitlab.com/alejandrogrjalva/PWA-ListaDeTareas.git" "HEAD:${GITHUB_REF}"