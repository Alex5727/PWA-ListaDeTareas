# ============================================================
# CI/CD - PWA ListaDeTareas
# Flujo de ramas: feature/* -> develop -> main
#   - Cualquier rama / Pull Request: build + test   (Integración continua)
#   - develop: build + test                          (Entrega continua: versión lista para publicar)
#   - main:    build + test + deploy automático      (Despliegue continuo a GitLab Pages)
# ============================================================

default:
  image: node:20-alpine

stages:
  - build
  - test
  - deploy

variables:
  # Archivos que forman la PWA (lo único que se publica)
  PWA_FILES: "index.html app.js app.css sw.js manifest.webmanifest Icon2.png"

# ------------------------------------------------------------
# 1) BUILD: prepara la carpeta public/ con los archivos de la PWA
# ------------------------------------------------------------
build:
  stage: build
  script:
    - mkdir -p public
    - cp $PWA_FILES public/
    # Versiona el caché del Service Worker con el commit actual.
    # Solo tiene efecto si sw.js contiene el texto __VERSION__ (ver instrucciones).
    - sed -i "s/__VERSION__/$CI_COMMIT_SHORT_SHA/g" public/sw.js
    - echo "Build de la version $CI_COMMIT_SHORT_SHA listo"
  artifacts:
    paths:
      - public
    expire_in: 1 week

# ------------------------------------------------------------
# 2) TEST: validaciones automáticas antes de publicar
# ------------------------------------------------------------
test:
  stage: test
  script:
    - echo "1. Verificando que existan todos los archivos de la PWA..."
    - for f in $PWA_FILES; do test -f "public/$f" || { echo "ERROR - falta el archivo $f"; exit 1; }; done
    - echo "2. Verificando la sintaxis de JavaScript..."
    - cp public/app.js /tmp/app.mjs && node --check /tmp/app.mjs
    - cp public/sw.js /tmp/sw.mjs && node --check /tmp/sw.mjs
    - echo "3. Verificando que el manifest sea JSON valido..."
    - node -e "JSON.parse(require('fs').readFileSync('public/manifest.webmanifest','utf8'))"
    - echo "Todas las pruebas pasaron correctamente"

# ------------------------------------------------------------
# 3) DEPLOY: publica en GitLab Pages solo desde la rama main
# ------------------------------------------------------------
pages:
  stage: deploy
  script:
    - echo "Desplegando la version $CI_COMMIT_SHORT_SHA en GitLab Pages..."
  pages: true
  artifacts:
    paths:
      - public
  environment:
    name: produccion
    url: $CI_PAGES_URL
  rules:
    - if: $CI_COMMIT_BRANCH == "main"